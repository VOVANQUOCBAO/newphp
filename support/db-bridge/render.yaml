services:
  - type: web
    name: phpweb-db-bridge
    runtime: node
    region: singapore
    plan: free
    numInstances: 1
    rootDir: support/db-bridge
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: 4000
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: DB_BRIDGE_TOKEN
        sync: false
