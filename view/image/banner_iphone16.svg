<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-iphone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="50%" stop-color="#112240"/>
      <stop offset="100%" stop-color="#1f4068"/>
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#f9d423"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3a7bd5" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0a192f" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="1920" height="600" fill="url(#bg-iphone)"/>
  <rect width="1920" height="600" fill="url(#glow)"/>
  
  <!-- Left Content -->
  <g transform="translate(140, 140)">
    <rect x="0" y="0" width="220" height="42" rx="21" fill="#d70018"/>
    <text x="110" y="27" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">🔥 SIÊU PHẨM MỚI 2024</text>
    
    <text x="0" y="115" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" letter-spacing="-1">iPhone 16 Pro Max</text>
    <text x="0" y="170" fill="url(#gold-grad)" font-family="'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="700">Titan Sa Mạc Đỉnh Cao - Chip A18 Pro Siêu Mạnh</text>
    <text x="0" y="225" fill="#ccd6f6" font-family="'Segoe UI', Roboto, sans-serif" font-size="22">Trải nghiệm Nút Điều Khiển Camera hoàn toàn mới. Apple Intelligence tiếng Việt.</text>
    
    <!-- Promotion box -->
    <g transform="translate(0, 260)">
      <rect width="480" height="70" rx="12" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
      <text x="20" y="32" fill="#ffd166" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="bold">🎁 Ưu đãi độc quyền ĐiệnThoạiZ:</text>
      <text x="20" y="55" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="16">Giảm ngay 3.000.000đ • Thu cũ trợ giá 4 Triệu • Trả góp 0%</text>
    </g>
    
    <!-- CTA Button -->
    <g transform="translate(510, 265)">
      <rect width="200" height="60" rx="30" fill="#0066cc"/>
      <text x="100" y="37" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">XEM NGAY →</text>
    </g>
  </g>
  
  <!-- Right Graphic: Mockup of Phone -->
  <g transform="translate(1300, 70)">
    <!-- Phone body -->
    <rect x="0" y="0" width="250" height="480" rx="42" fill="#2c2a29" stroke="#bfa382" stroke-width="6"/>
    <rect x="8" y="8" width="234" height="464" rx="36" fill="#000000"/>
    <rect x="12" y="12" width="226" height="456" rx="32" fill="#1b2430"/>
    <!-- Screen wallpaper graphics -->
    <circle cx="125" cy="240" r="90" fill="#c49a6c" opacity="0.8"/>
    <circle cx="125" cy="240" r="60" fill="#1b2430"/>
    <!-- Dynamic island -->
    <rect x="85" y="24" width="80" height="24" rx="12" fill="#000000"/>
    <!-- Glow around phone -->
    <ellipse cx="125" cy="510" rx="150" ry="20" fill="rgba(0,0,0,0.5)"/>
  </g>
  <g transform="translate(1500, 110)">
    <!-- Second Phone angled -->
    <rect x="0" y="0" width="230" height="440" rx="38" fill="#1e2022" stroke="#5a5e65" stroke-width="5"/>
    <rect x="8" y="8" width="214" height="424" rx="32" fill="#000000"/>
    <!-- Camera bump back -->
    <rect x="20" y="20" width="100" height="110" rx="25" fill="#2d3035"/>
    <circle cx="45" cy="45" r="20" fill="#15171a" stroke="#888" stroke-width="2"/>
    <circle cx="45" cy="100" r="20" fill="#15171a" stroke="#888" stroke-width="2"/>
    <circle cx="95" cy="72" r="20" fill="#15171a" stroke="#888" stroke-width="2"/>
  </g>
</svg>

