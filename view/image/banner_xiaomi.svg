<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-xiaomi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141E30"/>
      <stop offset="70%" stop-color="#243B55"/>
      <stop offset="100%" stop-color="#ff6900"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1920" height="600" fill="url(#bg-xiaomi)"/>
  
  <!-- Left Content -->
  <g transform="translate(140, 140)">
    <rect x="0" y="0" width="230" height="42" rx="21" fill="#e53935"/>
    <text x="115" y="27" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">📷 ĐẲNG CẤP LEICA</text>
    
    <text x="0" y="115" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" letter-spacing="-1">Xiaomi 14 Ultra 5G</text>
    <text x="0" y="170" fill="#ff9900" font-family="'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="700">Ống Kính Siêu Quang Học Leica Summilux</text>
    <text x="0" y="225" fill="#e2e8f0" font-family="'Segoe UI', Roboto, sans-serif" font-size="22">Cảm biến ảnh 1-inch LYT-900. Snapdragon 8 Gen 3 đỉnh cao đồ họa.</text>
    
    <!-- Promotion box -->
    <g transform="translate(0, 260)">
      <rect width="520" height="70" rx="12" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
      <text x="20" y="32" fill="#ffb703" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="bold">🎁 Bộ quà nhiếp ảnh trị giá 5.000.000đ:</text>
      <text x="20" y="55" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="16">Bao da cao cấp + Tay cầm chụp ảnh chuyên nghiệp + Bảo hành 24 tháng</text>
    </g>
    
    <!-- CTA Button -->
    <g transform="translate(550, 265)">
      <rect width="200" height="60" rx="30" fill="#ff6900"/>
      <text x="100" y="37" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">ĐẶT TRƯỚC →</text>
    </g>
  </g>
  
  <!-- Right Graphic: Xiaomi Camera Mockup -->
  <g transform="translate(1320, 80)">
    <rect x="0" y="0" width="250" height="470" rx="36" fill="#1f2937" stroke="#4b5563" stroke-width="6"/>
    <!-- Giant circular camera ring -->
    <circle cx="125" cy="180" r="105" fill="#111827" stroke="#9ca3af" stroke-width="4"/>
    <circle cx="125" cy="180" r="95" fill="#000000"/>
    <circle cx="125" cy="180" r="45" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="125" y="185" fill="#ef4444" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">LEICA</text>
    <!-- Mini lenses -->
    <circle cx="85" cy="140" r="18" fill="#1e293b"/>
    <circle cx="165" cy="140" r="18" fill="#1e293b"/>
    <circle cx="125" cy="240" r="18" fill="#1e293b"/>
  </g>
</svg>

