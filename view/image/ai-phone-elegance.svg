<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" role="img" aria-labelledby="title desc">
  <title id="title">Minh họa điện thoại cao cấp</title>
  <desc id="desc">Minh họa vector nguyên bản gồm hai điện thoại thông minh trên nền hồng tím.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fce7f3"/>
      <stop offset="1" stop-color="#ddd6fe"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fb7185"/>
      <stop offset=".52" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f8fafc"/>
      <stop offset=".5" stop-color="#cbd5e1"/>
      <stop offset="1" stop-color="#64748b"/>
    </linearGradient>
    <filter id="shadow" x="-.4" y="-.3" width="1.8" height="1.8">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#4c1d95" flood-opacity=".2"/>
    </filter>
  </defs>
  <rect width="480" height="480" rx="36" fill="url(#bg)"/>
  <circle cx="105" cy="116" r="62" fill="#fff" opacity=".28"/>
  <circle cx="384" cy="360" r="94" fill="#c4b5fd" opacity=".35"/>
  <g filter="url(#shadow)" transform="rotate(-12 174 244)">
