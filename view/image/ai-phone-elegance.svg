    <rect x="85" y="93" width="168" height="294" rx="28" fill="#0f172a"/>
    <rect x="92" y="100" width="154" height="280" rx="23" fill="url(#screen)"/>
    <path d="M96 286c39-79 78-24 114-107 14-32 25-35 36-43v244H96z" fill="#fda4af" opacity=".45"/>
    <circle cx="170" cy="130" r="6" fill="#1e1b4b"/>
    <rect x="139" y="365" width="58" height="5" rx="3" fill="#fff" opacity=".7"/>
  </g>
  <g filter="url(#shadow)" transform="rotate(12 310 230)">
    <rect x="254" y="92" width="138" height="252" rx="28" fill="#334155"/>
    <rect x="261" y="99" width="124" height="238" rx="23" fill="#1e293b"/>
    <rect x="270" y="109" width="58" height="77" rx="18" fill="#475569"/>
    <circle cx="289" cy="130" r="10" fill="#0f172a" stroke="#94a3b8" stroke-width="3"/>
    <circle cx="311" cy="153" r="10" fill="#0f172a" stroke="#94a3b8" stroke-width="3"/>
    <circle cx="286" cy="164" r="5" fill="#fde68a"/>
    <path d="M275 223c30-30 72-25 96 7v93h-96z" fill="url(#screen)" opacity=".8"/>
