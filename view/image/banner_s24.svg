<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-samsung" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021B79"/>
      <stop offset="60%" stop-color="#0575E6"/>
      <stop offset="100%" stop-color="#00F260"/>
    </linearGradient>
    <radialGradient id="ai-glow" cx="80%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#021B79" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="1920" height="600" fill="url(#bg-samsung)"/>
  <rect width="1920" height="600" fill="url(#ai-glow)"/>
  
  <!-- Left Content -->
  <g transform="translate(140, 140)">
    <rect x="0" y="0" width="230" height="42" rx="21" fill="#000000"/>
    <text x="115" y="27" fill="#00f2fe" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">✨ GALAXY AI ĐÃ ĐẾN</text>
    
    <text x="0" y="115" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" letter-spacing="-1">Samsung Galaxy S24 Ultra</text>
    <text x="0" y="170" fill="#ffeb3b" font-family="'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="700">Quyền Năng Trí Tuệ Nhân Tạo Mới Nhất</text>
    <text x="0" y="225" fill="#e0f2fe" font-family="'Segoe UI', Roboto, sans-serif" font-size="22">Khoanh tròn để tìm kiếm đa năng. Phiên dịch trực tiếp cuộc gọi hai chiều.</text>
    
    <!-- Promotion box -->
    <g transform="translate(0, 260)">
      <rect width="500" height="70" rx="12" fill="rgba(0,0,0,0.3)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
      <text x="20" y="32" fill="#00ffcc" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="bold">🎁 Quà tặng Đặc quyền Samsung:</text>
      <text x="20" y="55" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="16">Tặng củ sạc nhanh 45W • Trợ giá thu cũ 5.000.000đ • Samsung Care+ 1 năm</text>
    </g>
    
    <!-- CTA Button -->
    <g transform="translate(530, 265)">
      <rect width="210" height="60" rx="30" fill="#ffffff"/>
      <text x="105" y="37" fill="#021B79" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">KHÁM PHÁ →</text>
    </g>
  </g>
  
  <!-- Right Graphic: S24 Ultra Mockup -->
  <g transform="translate(1320, 60)">
    <!-- Box Phone with S-Pen -->
    <rect x="0" y="0" width="260" height="490" rx="20" fill="#4a5568" stroke="#cbd5e0" stroke-width="5"/>
    <rect x="8" y="8" width="244" height="474" rx="14" fill="#0a0a0c"/>
    <rect x="12" y="12" width="236" height="466" rx="10" fill="#111827"/>
    <!-- Screen graphic -->
    <polygon points="130,150 180,260 80,260" fill="#00f2fe" opacity="0.8"/>
    <circle cx="130" cy="270" r="50" fill="#0575e6" opacity="0.6"/>
    <!-- Camera punch hole -->
    <circle cx="130" cy="30" r="5" fill="#000000"/>
    <!-- S-Pen -->
    <g transform="translate(290, 80) rotate(15)">
      <rect x="0" y="0" width="16" height="380" rx="8" fill="#e2e8f0" stroke="#718096" stroke-width="2"/>
      <polygon points="0,380 8,420 16,380" fill="#2d3748"/>
      <rect x="2" y="20" width="12" height="40" rx="4" fill="#3182ce"/>
    </g>
  </g>
</svg>

